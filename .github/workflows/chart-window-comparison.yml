name: Compare and integrate bounded chart windows
on:
  push:
    branches: [charting/windowed-adapter-performance]
    paths: [.github/workflows/chart-window-comparison.yml]
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: charting/windowed-adapter-performance
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Measure the existing full-clone window path
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/chart-window-comparison
          git rev-parse HEAD | tee artifacts/chart-window-comparison/baseline-commit.txt
          dotnet run --project tests/ProDataGrid.Charting.Benchmarks/ProDataGrid.Charting.Benchmarks.csproj -c Release | tee artifacts/chart-window-comparison/before.txt
      - name: Apply narrowly scoped window copying and structural sampling guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ProDataGrid.Charting/DataGridChartModel.cs')
          t = p.read_text()
          def once(text, old, new):
              if text.count(old) != 1:
                  raise RuntimeError('Expected one reviewed anchor: ' + old[:120])
              return text.replace(old, new, 1)
          t = once(t, '                var cloned = cache.Clone();', '                var cloned = cache.Clone(windowStart, windowCount);')
          start = t.index('                if (needsWindow)\n')
          end = t.index('                if (needsDownsample)\n', start)
          removed = t[start:end]
          if removed.count('ApplyWindow(categories, seriesValues, seriesXValues, seriesSizeValues, windowStart, windowCount);') != 1 or len(removed.splitlines()) > 7:
              raise RuntimeError('Unexpected window application block.')
          t = t[:start] + t[end:]
          start = t.index('        private void ApplyWindow(')
          end = t.index('        private ChartDownsampleMode ResolveDownsampleMode(', start)
          t = t[:start] + t[end:]
          if 'ApplyWindow(' in t or 'TrimList' in t:
              raise RuntimeError('Unexpected additional window helper callers; review before changing them.')
          anchor = '        private ChartDownsampleMode ResolveDownsampleMode(ChartDownsampleMode requested)\n        {'
          guard = '\n'.join([
              '',
              '            // Matrix cells, hierarchy weights, and gauge slots carry category identity.',
              '            // Sampling/averaging them as line observations would change their meaning.',
              '            for (var i = 0; i < Series.Count; i++)',
              '            {',
              '                if (Series[i].Kind is ChartSeriesKind.Heatmap or ChartSeriesKind.Treemap or',
              '                    ChartSeriesKind.Sunburst or ChartSeriesKind.Gauge)',
              '                {',
              '                    return ChartDownsampleMode.None;',
              '                }',
              '            }',
              ''
          ])
          t = once(t, anchor, anchor + guard)
          start = t.index('            public ChartDataCache Clone()')
          end = t.index('        private sealed class SeriesAggregator', start)
          block = t[start:end]
          anchor = '            public ChartDataCache Clone()\n            {\n                var categories = new List<string?>(Categories);'
          replacement = '\n'.join([
              '            public ChartDataCache Clone() => Clone(null, null);',
              '',
              '            public ChartDataCache Clone(int? windowStart, int? windowCount)',
              '            {',
              '                var start = Math.Clamp(windowStart ?? 0, 0, Categories.Count);',
              '                var count = Math.Clamp(windowCount ?? (Categories.Count - start), 0, Categories.Count - start);',
              '                var categories = Categories.GetRange(start, count);'
          ])
          block = once(block, anchor, replacement)
          block = once(block, 'new List<double?>(SeriesValues[i])', 'SeriesValues[i].GetRange(start, count)')
          block = once(block, 'new List<double>(SeriesXValues[i]!)', 'SeriesXValues[i]!.GetRange(start, count)')
          block = once(block, 'new List<double?>(SeriesSizeValues[i]!)', 'SeriesSizeValues[i]!.GetRange(start, count)')
          t = t[:start] + block + t[end:]
          p.write_text(t)
          PY
          git diff --check
      - name: Measure the bounded-copy path on the same runner
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project tests/ProDataGrid.Charting.Benchmarks/ProDataGrid.Charting.Benchmarks.csproj -c Release | tee artifacts/chart-window-comparison/after.txt
          git diff -- src/ProDataGrid.Charting/DataGridChartModel.cs > artifacts/chart-window-comparison/change.patch
      - name: Commit the implementation and remove the temporary comparison workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/chart-window-comparison.yml
          git add src/ProDataGrid.Charting/DataGridChartModel.cs .github/workflows/chart-window-comparison.yml
          git commit -m 'Copy only requested chart windows and preserve structural chart categories during sampling'
          git rev-parse HEAD | tee artifacts/chart-window-comparison/optimized-commit.txt
          git push origin HEAD:refs/heads/charting/windowed-adapter-performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-chart-window-before-after
          path: artifacts/chart-window-comparison
          retention-days: 14
