name: Apply checked chart integration corrections
on:
  push:
    branches: [charting/advanced-chart-families]
    paths: [.github/workflows/charting-integration-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: charting/advanced-chart-families
      - name: Apply exact reviewed edits and remove this one-shot workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ProCharts.Skia/SkiaChartRenderer.Advanced.cs')
          t = p.read_text()
          replacements = {
              'DrawLegend(canvas, legend, snapshot, style, context.Kind);': 'DrawLegend(canvas, legend, snapshot, style);',
              'GetSeriesColor(hierarchy.BranchIndices[node], style)': 'GetSeriesColor(style, hierarchy.BranchIndices[node])',
              'GetSeriesColor(item.Series, style)': 'GetSeriesColor(style, item.Series)',
              'using SKPaint text = CreateTextPaint(style.Text, Math.Max(1, style.LabelSize));': 'using SKPaint text = new() { IsAntialias = true, Color = style.Text };\n                using SKFont font = new(SKTypeface.Default, Math.Max(1, style.LabelSize)) { Subpixel = true };',
              'style, paint, text);': 'style, paint, text, font);',
              'style, paint, text, path);': 'style, paint, text, font, path);',
              'SkiaChartStyle style, SKPaint paint, SKPaint text)': 'SkiaChartStyle style, SKPaint paint, SKPaint text, SKFont font)',
              'SkiaChartStyle style, SKPaint paint, SKPaint text, SKPath path)': 'SkiaChartStyle style, SKPaint paint, SKPaint text, SKFont font, SKPath path)',
              ', text, true);': ', text, font, true);',
              ', text, false);': ', text, font, false);',
              'string? label, SKPaint text, bool centered)': 'string? label, SKPaint text, SKFont font, bool centered)',
              'text.TextSize': 'font.Size',
              'text.MeasureText(label)': 'font.MeasureText(label, text)',
              'text.FontMetrics': 'font.Metrics',
              'canvas.DrawText(label, x, y, text);': 'canvas.DrawText(label, x, y, SKTextAlign.Left, font, text);'
          }
          for old, new in replacements.items():
              if old not in t:
                  raise RuntimeError('Missing reviewed integration anchor: ' + old)
              t = t.replace(old, new)
          p.write_text(t)
          p = Path('src/ProCharts/ChartHierarchyLayout.cs')
          t = p.read_text()
          for name in ['ChartLayoutRect', 'ChartTreemapCell', 'ChartSunburstSector']:
              old = 'public readonly struct ' + name
              if t.count(old) != 1:
                  raise RuntimeError('Unexpected geometry declaration: ' + name)
              t = t.replace(old, 'public readonly record struct ' + name)
          p.write_text(t)
          Path('.github/workflows/charting-integration-fix.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ProCharts.Skia/SkiaChartRenderer.Advanced.cs src/ProCharts/ChartHierarchyLayout.cs .github/workflows/charting-integration-fix.yml
          git commit -m 'Fix renderer helper integration, use scoped SKFont resources and give geometry value equality'
          git push origin HEAD:refs/heads/charting/advanced-chart-families
