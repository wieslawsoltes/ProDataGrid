name: Integrate and compare chart interaction
on:
  push:
    branches: [charting/indexed-interaction]
    paths: [.github/workflows/charting-interaction-prepare.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: charting/indexed-interaction
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Apply reviewed integration hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def once(t, a, b):
              if t.count(a) != 1: raise RuntimeError('Unexpected integration anchor: ' + a[:120])
              return t.replace(a, b, 1)
          p = Path('src/ProCharts.Skia/SkiaChartRenderer.cs')
          t = p.read_text()
          a = 'if (!TryBuildRenderContext(bounds, snapshot, style, out var context))'
          if t.count(a) != 3: raise RuntimeError('Unexpected render-context call sites')
          t = t.replace(a, 'if (!TryGetRenderContext(bounds, snapshot, style, out var context))')
          a = '        public SkiaChartHitTestResult? HitTest(SKPoint point, SKRect bounds, ChartDataSnapshot snapshot, SkiaChartStyle? style = null)\n        {\n'
          guard = '            ArgumentNullException.ThrowIfNull(snapshot);\n            if (!float.IsFinite(point.X) || !float.IsFinite(point.Y) ||\n                !float.IsFinite(bounds.Left) || !float.IsFinite(bounds.Top) ||\n                !float.IsFinite(bounds.Right) || !float.IsFinite(bounds.Bottom) ||\n                !float.IsFinite(bounds.Width) || !float.IsFinite(bounds.Height) ||\n                bounds.Width <= 0 || bounds.Height <= 0) return null;\n'
          t = once(t, a, a + guard)
          a = '            if (IsAdvancedChart(snapshot))\n            {\n                return HitTestAdvanced(point, bounds, snapshot, style);\n            }'
          t = once(t, a, a + '\n            if (TryHitTestIndexed(point, bounds, snapshot, style, out var indexedHit))\n            {\n                return indexedHit;\n            }')
          p.write_text(t)
          p = Path('src/ProCharts.Skia/SkiaChartRenderer.HitTest.cs')
          t = p.read_text()
          t = once(t, '                            minBubbleSize,\n                            maxBubbleSize,\n                            style,', '                            minBubbleSize,\n                            maxBubbleSize,\n                            axisKind,\n                            style,')
          t = once(t, '            double maxBubbleSize,\n            SkiaChartStyle style,', '            double maxBubbleSize,\n            ChartAxisKind valueAxisKind,\n            SkiaChartStyle style,')
          t = once(t, '            var valueAxisKind = style.ValueAxisKind;\n', '')
          p.write_text(t)
          p = Path('.github/workflows/charting.yml')
          t = p.read_text().replace("      - 'tests/ProCharts.Benchmarks/**'", "      - 'tests/ProCharts.Benchmarks/**'\n      - 'tests/ProCharts.Interaction.Benchmarks/**'")
          t = once(t, '      - name: Upload diagnostics', '      - name: Measure chart interaction\n        run: dotnet run --project tests/ProCharts.Interaction.Benchmarks/ProCharts.Interaction.Benchmarks.csproj -c Release | tee artifacts/charting/interaction-performance.txt\n      - name: Upload diagnostics')
          p.write_text(t)
          Path('.github/workflows/charting-source-audit.yml').unlink()
          Path('.github/workflows/charting-interaction-prepare.yml').unlink()
          PY
          git diff --check
      - name: Run charting regressions and supported target builds
        run: |
          dotnet build src/ProCharts.Skia/ProCharts.Skia.csproj -c Release
          dotnet test src/Avalonia.Controls.DataGrid.UnitTests/Avalonia.Controls.DataGrid.UnitTests.csproj -c Release -p:CollectCoverage=false --filter FullyQualifiedName~Charting --logger trx --results-directory artifacts/interaction
      - name: Compare actual old and indexed paths on this runner
        shell: bash
        run: |
          set -o pipefail
          git worktree add --detach /tmp/charting-before c627e6ee5ce7f2b688ab3353e0da95c3f3073c68
          cp -R tests/ProCharts.Interaction.Benchmarks /tmp/charting-before/tests/
          find /tmp/charting-before/tests/ProCharts.Interaction.Benchmarks -type d \( -name bin -o -name obj \) -prune -exec rm -rf '{}' +
          dotnet run --project /tmp/charting-before/tests/ProCharts.Interaction.Benchmarks/ProCharts.Interaction.Benchmarks.csproj -c Release > artifacts/interaction/before.txt
          dotnet run --project tests/ProCharts.Interaction.Benchmarks/ProCharts.Interaction.Benchmarks.csproj -c Release > artifacts/interaction/after.txt
          git diff > artifacts/interaction/integration.patch
      - name: Commit reviewed hooks without temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ProCharts.Skia/SkiaChartRenderer.cs src/ProCharts.Skia/SkiaChartRenderer.HitTest.cs .github/workflows/charting.yml .github/workflows/charting-source-audit.yml .github/workflows/charting-interaction-prepare.yml
          git commit -m 'Integrate indexed point interaction, correct bubble secondary scale and retain read-only diagnostics'
          git push origin HEAD:refs/heads/charting/indexed-interaction
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-interaction-comparison
          path: artifacts/interaction
          retention-days: 14
