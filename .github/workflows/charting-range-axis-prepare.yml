name: Finish numeric axis integration
on:
  push:
    branches: [charting/range-area-bands]
    paths: [.github/workflows/charting-range-axis-prepare.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the four known pre-integration PR runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          prefix = 'https://api.github.com/repos/wieslawsoltes/ProDataGrid/actions/runs/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          expected = '4f038599358a7cfabe5dfe43efa50dffcbd9f416'
          for run_id in (36546377021, 36546377170, 36546377002, 36546377121):
              url = prefix + str(run_id)
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  run = json.load(response)
              if run['head_sha'] != expected or run['head_branch'] != 'charting/range-area-bands' or run['event'] != 'pull_request':
                  raise RuntimeError('Refusing to cancel a run outside the reviewed obsolete head')
              if run['status'] == 'completed':
                  print(str(run_id) + ': already completed')
                  continue
              try:
                  with urllib.request.urlopen(urllib.request.Request(url + '/cancel', headers=headers, data=b'', method='POST')) as response:
                      print(str(run_id) + ': cancellation requested, HTTP ' + str(response.status))
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
                  print(str(run_id) + ': completed during cancellation')
          PY
