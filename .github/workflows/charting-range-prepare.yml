name: Integrate range-area chart pipeline
on:
  push:
    branches: [charting/range-area-bands]
    paths: [.github/workflows/charting-range-prepare.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: charting/range-area-bands
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Apply exact reviewed edge-case corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def once(t, a, b):
              if t.count(a) != 1: raise RuntimeError('Unexpected correction anchor: ' + a)
              return t.replace(a, b, 1)
          p = Path('src/ProCharts/ChartRangeSeries.cs')
          p.write_text(once(p.read_text(), 'low + difference / 2', 'Math.FusedMultiplyAdd(difference, 0.5, low)'))
          p = Path('src/ProCharts.Skia/SkiaChartRenderer.RangeArea.cs')
          t = once(p.read_text(), 'low + difference / 2', 'Math.FusedMultiplyAdd(difference, 0.5, low)')
          t = once(t, 'if (!plot.Contains(point.X, y)) continue;', 'if (point.X < plot.Left || point.X > plot.Right || y < plot.Top || y > plot.Bottom) continue;')
          t = once(t, 'false, style.DataLabelPadding, style.DataLabelOffset);', 'true, style.DataLabelPadding, style.DataLabelOffset);')
          p.write_text(t)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ProCharts/ChartRangeSeries.cs src/ProCharts.Skia/SkiaChartRenderer.RangeArea.cs
          git commit -m 'Place endpoint interval labels inside the plot and use fused midpoint reconstruction'
          git push origin HEAD:refs/heads/charting/range-area-bands
      - name: Build and test range core, rendering and bound sample
        shell: bash
        run: |
          mkdir -p artifacts/charting
          dotnet build src/ProCharts.Skia/ProCharts.Skia.csproj -c Release > artifacts/charting/build.log 2>&1
          dotnet test src/Avalonia.Controls.DataGrid.UnitTests/Avalonia.Controls.DataGrid.UnitTests.csproj -c Release -p:CollectCoverage=false --filter FullyQualifiedName~Charting --logger trx --results-directory artifacts/charting > artifacts/charting/core-test.log 2>&1
          dotnet test src/DataGridSample.UnitTests/DataGridSample.UnitTests.csproj -c Release --filter FullyQualifiedName~Chart --logger trx --results-directory artifacts/charting/sample > artifacts/charting/sample-test.log 2>&1
      - name: Retain audited source and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/charting
          git rev-parse HEAD > artifacts/charting/source-commit.txt
          git archive --format=zip HEAD -o artifacts/charting/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: range-area-integration
          path: artifacts/charting
          retention-days: 14
