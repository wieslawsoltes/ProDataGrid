name: Charting source audit
on:
  push:
    branches: [charting/indexed-interaction]
    paths: [.github/workflows/charting-source-audit.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source and configuration
        run: |
          mkdir -p /tmp/charting-audit
          git archive --format=zip --output=/tmp/charting-audit/source.zip HEAD
          git log -8 --oneline > /tmp/charting-audit/commits.txt
      - uses: actions/upload-artifact@v4
        with:
          name: charting-source-audit
          path: /tmp/charting-audit
          retention-days: 1
