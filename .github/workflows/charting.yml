name: Charting regression and performance

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'src/ProCharts*/**'
      - 'src/ProDataGrid.Charting/**'
      - 'src/Avalonia.Controls.DataGrid.UnitTests/Charting/**'
      - 'src/DataGridSample/**/Chart*'
      - 'src/DataGridSample/MainWindow.axaml'
      - 'src/DataGridSample.UnitTests/Chart*'
      - 'tests/ProCharts.Benchmarks/**'
      - 'tests/ProCharts.Decimation.Benchmarks/**'
      - 'tests/ProCharts.Interaction.Benchmarks/**'
      - 'tests/ProCharts.Range.Benchmarks/**'
      - 'tests/ProCharts.RangeStreaming.Benchmarks/**'
      - 'tests/ProCharts.Streaming.Benchmarks/**'
      - 'tests/ProDataGrid.Charting.Benchmarks/**'
      - '.github/workflows/charting.yml'
      - 'Directory.*.props'
      - 'global.json'
  push:
    branches: [master, main]
    paths:
      - 'src/ProCharts*/**'
      - 'src/ProDataGrid.Charting/**'
      - 'src/Avalonia.Controls.DataGrid.UnitTests/Charting/**'
      - 'src/DataGridSample/**/Chart*'
      - 'src/DataGridSample/MainWindow.axaml'
      - 'src/DataGridSample.UnitTests/Chart*'
      - 'tests/ProCharts.Benchmarks/**'
      - 'tests/ProCharts.Decimation.Benchmarks/**'
      - 'tests/ProCharts.Interaction.Benchmarks/**'
      - 'tests/ProCharts.Range.Benchmarks/**'
      - 'tests/ProCharts.RangeStreaming.Benchmarks/**'
      - 'tests/ProCharts.Streaming.Benchmarks/**'
      - 'tests/ProDataGrid.Charting.Benchmarks/**'
      - '.github/workflows/charting.yml'
      - 'Directory.*.props'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charting-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  charting:
    name: Charting tests and reproducible benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build both supported rendering targets
        run: dotnet build src/ProCharts.Skia/ProCharts.Skia.csproj -c Release
      - name: Charting regressions
        run: dotnet test src/Avalonia.Controls.DataGrid.UnitTests/Avalonia.Controls.DataGrid.UnitTests.csproj -c Release -p:CollectCoverage=false --filter FullyQualifiedName~Charting --logger trx --results-directory artifacts/charting
      - name: Chart sample integration
        run: dotnet test src/DataGridSample.UnitTests/DataGridSample.UnitTests.csproj -c Release --filter FullyQualifiedName~Chart --logger trx --results-directory artifacts/charting/sample
      - name: Measure streaming and decimation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/charting
          dotnet run --project tests/ProCharts.Benchmarks/ProCharts.Benchmarks.csproj -c Release | tee artifacts/charting/performance.txt
      - name: Measure bounded grid-chart windows
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project tests/ProDataGrid.Charting.Benchmarks/ProDataGrid.Charting.Benchmarks.csproj -c Release | tee artifacts/charting/grid-window-performance.txt
      - name: Measure chart interaction
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project tests/ProCharts.Interaction.Benchmarks/ProCharts.Interaction.Benchmarks.csproj -c Release | tee artifacts/charting/interaction-performance.txt
      - name: Compare range-area interaction
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project tests/ProCharts.Range.Benchmarks/ProCharts.Range.Benchmarks.csproj -c Release | tee artifacts/charting/range-interaction-performance.txt
      - name: Compare full and reduced range drawing
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project tests/ProCharts.Decimation.Benchmarks/ProCharts.Decimation.Benchmarks.csproj -c Release | tee artifacts/charting/range-decimation-performance.txt
      - name: Compare replacement and streaming range ingestion
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project tests/ProCharts.RangeStreaming.Benchmarks/ProCharts.RangeStreaming.Benchmarks.csproj -c Release | tee artifacts/charting/range-streaming-performance.txt
      - name: Compare batch and incremental indicators
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project tests/ProCharts.Streaming.Benchmarks/ProCharts.Streaming.Benchmarks.csproj -c Release | tee artifacts/charting/incremental-indicator-performance.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charting-regression-and-performance
          path: artifacts/charting
          if-no-files-found: warn
          retention-days: 14
