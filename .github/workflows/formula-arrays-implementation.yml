name: Formula array integration validation
on:
  push:
    branches: [work/formula-modern-arrays]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'wieslawsoltes/ProDataGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/formula-modern-arrays
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Integrate current master and remove one-time scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-edit origin/master
          git rm tools/apply-formula-arrays.py .github/workflows/formula-arrays-implementation.yml
          git commit -m 'Remove temporary array implementation scaffolding'
      - name: Validate integrated source
        run: |
          git diff HEAD^ --check
          dotnet test src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj -c Release --logger trx --results-directory artifacts/formula
      - name: Push validated integration
        run: git push origin HEAD:work/formula-modern-arrays
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-array-integration-validation
          path: artifacts/formula/*.trx
