name: Formula core implementation validation
on:
  push:
    branches: [work/formula-evaluation-performance]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'wieslawsoltes/ProDataGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/formula-evaluation-performance
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Apply guarded source edits
        run: python3 tools/apply-formula-core.py
      - name: Check patch and execute formula regressions
        run: |
          git diff --check
          dotnet test src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj -c Release --logger trx --results-directory artifacts/formula
      - name: Commit validated source edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ProDataGrid.FormulaEngine/FormulaCompiledExpression.cs src/ProDataGrid.FormulaEngine/FormulaEvaluation.cs src/ProDataGrid.FormulaEngine.Excel/ExcelFunctionRegistry.cs
          git commit -m 'Optimize compiled formula evaluation and invalidate revised function plans'
          git push origin HEAD:work/formula-evaluation-performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-core-validation
          path: artifacts/formula/*.trx
