name: Formula combined validation and baseline comparison
on:
  push:
    branches: [work/formula-final-validation]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'wieslawsoltes/ProDataGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_TieredCompilation: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/formula-final-validation
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Integrate the exact reviewed formula PR heads
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit 1c8347e33137549e07ba4bc2dabfc4080a6ab937
          git merge --no-edit 27ac04f52990e89403809831e8e8bbdb5e537445
          git rm .github/workflows/formula-final-validation.yml
          git commit -m 'Record clean combined formula integration for validation'
          git diff HEAD^ --check
      - name: Execute the complete integrated formula test suite
        run: dotnet test src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj -c Release --logger trx --results-directory artifacts/formula
      - name: Build identical benchmark harness for the original and final implementations
        run: |
          BASE="$RUNNER_TEMP/formula-original-baseline"
          git worktree add --detach "$BASE" a99aa2098a4aebd5cc2eb3e6197daf2587e234d2
          mkdir -p "$BASE/tools"
          cp -R tools/formula-benchmarks "$BASE/tools/"
          dotnet build tools/formula-benchmarks/FormulaBenchmarks.csproj -c Release
          dotnet build "$BASE/tools/formula-benchmarks/FormulaBenchmarks.csproj" -c Release
          lscpu > artifacts/formula/cpu.txt
          dotnet --info > artifacts/formula/runtime.txt
          printf 'baseline=a99aa2098a4aebd5cc2eb3e6197daf2587e234d2\ncombined=%s\nnumeric_pr_357=1c8347e33137549e07ba4bc2dabfc4080a6ab937\nstorage_pr_358=27ac04f52990e89403809831e8e8bbdb5e537445\nDOTNET_TieredCompilation=0\norder=baseline,current,current,baseline\n' "$(git rev-parse HEAD)" > artifacts/formula/revisions.txt
          git ls-tree -r HEAD src/ProDataGrid.FormulaEngine src/ProDataGrid.FormulaEngine.Excel src/ProDataGrid.FormulaEngine.UnitTests tools/formula-benchmarks > artifacts/formula/validated-source-blobs.txt
      - name: Measure combined improvements against the original baseline
        run: |
          BASE="$RUNNER_TEMP/formula-original-baseline"
          ROOT="$PWD"
          dotnet run --no-build -c Release --project "$BASE/tools/formula-benchmarks/FormulaBenchmarks.csproj" -- "$ROOT/artifacts/formula/baseline-1.csv" original-1
          dotnet run --no-build -c Release --project tools/formula-benchmarks/FormulaBenchmarks.csproj -- "$ROOT/artifacts/formula/current-1.csv" combined-1
          dotnet run --no-build -c Release --project tools/formula-benchmarks/FormulaBenchmarks.csproj -- "$ROOT/artifacts/formula/current-2.csv" combined-2
          dotnet run --no-build -c Release --project "$BASE/tools/formula-benchmarks/FormulaBenchmarks.csproj" -- "$ROOT/artifacts/formula/baseline-2.csv" original-2
      - name: Publish the clean tested integration branch
        run: git push origin HEAD:work/formula-final-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-combined-validation-and-original-baseline
          path: artifacts/formula/*
