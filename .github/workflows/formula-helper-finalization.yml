name: Formula helper final integration
on:
  push:
    branches: [work/formula-higher-order-arrays]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'wieslawsoltes/ProDataGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/formula-higher-order-arrays
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Integrate current master and callable-array composition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          if ! git merge --no-edit origin/master; then
            python3 - <<'PY'
          import subprocess, difflib
          def git(*args): return subprocess.check_output(['git', *args], text=True)
          path = 'src/ProDataGrid.FormulaEngine.UnitTests/FormulaLexicalBoundaryTests.cs'
          assert git('diff', '--name-only', '--diff-filter=U').splitlines() == [path]
          left, right = git('show', ':2:' + path), git('show', ':3:' + path)
          if left != right:
              print(''.join(difflib.unified_diff(right.splitlines(True), left.splitlines(True))))
          assert left == right, 'Nontrivial test conflict requires review'
          subprocess.run(['git', 'checkout', '--ours', '--', path], check=True)
          subprocess.run(['git', 'add', path], check=True)
          PY
            git commit --no-edit
          fi
          python3 tools/finalize-formula-helpers.py
          git rm tools/finalize-formula-helpers.py .github/workflows/formula-helper-finalization.yml
          git add src/ProDataGrid.FormulaEngine.Excel/ExcelLambdaHelperUtilities.cs src/ProDataGrid.FormulaEngine.UnitTests/ExcelLambdaHelperTests.cs
          git commit -m 'Allow intermediate callable arrays while retaining worksheet publication guards'
      - name: Validate all formula regressions
        run: |
          git diff HEAD^ --check
          dotnet test src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj -c Release --logger trx --results-directory artifacts/tests
      - name: Push clean validated branch
        run: git push origin HEAD:work/formula-higher-order-arrays
      - name: Export validation sources
        if: always()
        run: |
          mkdir -p artifacts
          git archive HEAD > artifacts/source.tar
          git rev-parse HEAD > artifacts/revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-helper-final-validation
          path: artifacts
