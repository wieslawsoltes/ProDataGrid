name: Formula helper integration validation
on:
  push:
    branches: [work/formula-higher-order-arrays]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'wieslawsoltes/ProDataGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fix shared count and spill-anchor integration
        run: python3 tools/fix-formula-helper-integration.py
      - name: Execute all formula tests
        run: |
          git diff --check
          dotnet test src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj -c Release --logger trx --results-directory artifacts/tests
      - name: Commit validated source and remove scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/fix-formula-helper-integration.py .github/workflows/formula-helper-validation.yml
          git add src
          git commit -m 'Correct shared count semantics and scalar reads of spill anchors'
          git push origin HEAD:work/formula-higher-order-arrays
      - name: Export source for integration review
        if: always()
        run: |
          mkdir -p artifacts
          tar --exclude=.git --exclude=artifacts --exclude=bin --exclude=obj -cf artifacts/source.tar .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-helper-integration-validation
          path: artifacts
