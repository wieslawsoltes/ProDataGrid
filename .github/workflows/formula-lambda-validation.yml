name: Formula lambda final validation
on:
  push:
    branches: [work/formula-lambda-helpers]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'wieslawsoltes/ProDataGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Finalize dependency precedence and remove implementation scaffolding
        run: |
          python3 tools/stabilize-formula-lambda.py
          git rm tools/apply-formula-lambda.py tools/refine-formula-lambda.py tools/stabilize-formula-lambda.py .github/workflows/formula-lambda-validation.yml
      - name: Run all formula regressions
        run: |
          git diff --check
          dotnet test src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj -c Release --logger trx --results-directory artifacts/tests
      - name: Commit validated final source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Finalize lexical function integration with registry-aware dependency precedence'
          git push origin HEAD:work/formula-lambda-helpers
      - name: Export tested source
        if: always()
        run: |
          mkdir -p artifacts
          tar --exclude=.git --exclude=artifacts --exclude=bin --exclude=obj -cf artifacts/source.tar .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-lambda-final-validation
          path: artifacts
