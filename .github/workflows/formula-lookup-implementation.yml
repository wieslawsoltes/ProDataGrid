name: Formula lookup implementation validation
on:
  push:
    branches: [work/formula-lookup-performance]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'wieslawsoltes/ProDataGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_TieredCompilation: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/formula-lookup-performance
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Apply guarded lookup and unique edits
        run: python3 tools/apply-formula-lookup.py
      - name: Execute formula regressions
        run: |
          git diff --check
          dotnet test src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj -c Release --logger trx --results-directory artifacts/formula
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ProDataGrid.FormulaEngine.Excel/ExcelLookupFunctions.cs src/ProDataGrid.FormulaEngine.Excel/ExcelDynamicArrayFunctions.cs
          git commit -m 'Use binary lookup and indexed uniqueness while preserving comparison compatibility'
      - name: Build identical benchmark harness against baseline and current source
        run: |
          BASE="$RUNNER_TEMP/formula-baseline"
          git worktree add --detach "$BASE" a99aa2098a4aebd5cc2eb3e6197daf2587e234d2
          mkdir -p "$BASE/tools"
          cp -R tools/formula-benchmarks "$BASE/tools/"
          dotnet build tools/formula-benchmarks/FormulaBenchmarks.csproj -c Release
          dotnet build "$BASE/tools/formula-benchmarks/FormulaBenchmarks.csproj" -c Release
          lscpu > artifacts/formula/cpu.txt
          dotnet --info > artifacts/formula/runtime.txt
          printf 'baseline=a99aa2098a4aebd5cc2eb3e6197daf2587e234d2\nhead=%s\nDOTNET_TieredCompilation=0\norder=baseline,current,current,baseline\n' "$(git rev-parse HEAD)" > artifacts/formula/revisions.txt
      - name: Run measured baseline-current-current-baseline comparison
        run: |
          BASE="$RUNNER_TEMP/formula-baseline"
          ROOT="$PWD"
          dotnet run --no-build -c Release --project "$BASE/tools/formula-benchmarks/FormulaBenchmarks.csproj" -- "$ROOT/artifacts/formula/baseline-1.csv" baseline-1
          dotnet run --no-build -c Release --project tools/formula-benchmarks/FormulaBenchmarks.csproj -- "$ROOT/artifacts/formula/current-1.csv" current-1
          dotnet run --no-build -c Release --project tools/formula-benchmarks/FormulaBenchmarks.csproj -- "$ROOT/artifacts/formula/current-2.csv" current-2
          dotnet run --no-build -c Release --project "$BASE/tools/formula-benchmarks/FormulaBenchmarks.csproj" -- "$ROOT/artifacts/formula/baseline-2.csv" baseline-2
      - name: Push validated implementation
        run: git push origin HEAD:work/formula-lookup-performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-lookup-validation-and-benchmarks
          path: artifacts/formula/*
