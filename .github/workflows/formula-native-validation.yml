name: Formula NativeAOT validation
on:
  push:
    branches: [work/formula-final-validation]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'wieslawsoltes/ProDataGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/formula-final-validation
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Add temporary native parser and function smoke assertions
        run: |
          mkdir -p artifacts/formula
          python3 - <<'PY'
          from pathlib import Path
          file = Path('tools/formula-benchmarks/Program.cs')
          text = file.read_text(encoding='utf-8')
          marker = '            var functionContext = new FormulaFunctionContext(context);'
          assert text.count(marker) == 1
          cases = [
              ('SUM(1,2,3)', 6),
              ('IF(TRUE,42,1/0)', 42),
              ('IFERROR(1/0,19)', 19),
              ('SUM(TOCOL(HSTACK({1;2},{3;4})))', 10),
              ('INDEX(WRAPROWS(SEQUENCE(6),3),2,3)', 6),
              ('SUM(CHOOSECOLS({1,2,3;4,5,6},3,1))', 14),
              ('SUM(TAKE(SORTBY({10;20;30},{2;3;1}),2))', 40),
              ('SUM(DROP({1;2;3},1))', 5),
              ('XMATCH(6,{5,1,7,3},-1)', 1),
              ('XLOOKUP(6,{1,3,5,7},{10,30,50,70},,-1,2)', 50),
              ('SUM(UNIQUE({1;1;2}))', 3),
              ('SUM(TRANSPOSE({1,2;3,4}))', 10),
              ('SUM(EXPAND(1,2,2,0))', 1),
              ('SUM(CHOOSEROWS({1,2;3,4},-1))', 7),
              ('SUM(WRAPCOLS({1,2,3,4},2))', 10),
              ('SUM(TOROW({1,2;3,4},,TRUE))', 10),
          ]
          entries = '\n'.join('                ("' + formula + '", ' + str(expected) + 'd),' for formula, expected in cases)
          smoke = '''            var smokeParser = new ExcelFormulaParser();
                      var smokeEvaluator = new FormulaEvaluator();
                      var smokeResolver = new EmptyResolver();
                      var smokeCases = new (string Formula, double Expected)[]
                      {
          ''' + entries + '''
                      };
                      foreach (var compiledMode in new[] { true, false })
                      {
                          workbook.Settings.EnableCompiledExpressions = compiledMode;
                          foreach (var item in smokeCases)
                          {
                              var value = smokeEvaluator.Evaluate(smokeParser.Parse(item.Formula, new FormulaParseOptions()), context, smokeResolver);
                              if (value.Kind != FormulaValueKind.Number || value.AsNumber() != item.Expected)
                                  throw new InvalidOperationException("Native smoke failure: " + item.Formula + " => " + value);
                          }
                          var randomArray = smokeEvaluator.Evaluate(smokeParser.Parse("RANDARRAY(2,3,1,4,TRUE)", new FormulaParseOptions()), context, smokeResolver).AsArray();
                          if (randomArray.RowCount != 2 || randomArray.ColumnCount != 3) throw new InvalidOperationException("Native RANDARRAY shape failure.");
                          foreach (var randomValue in randomArray.Flatten())
                          {
                              var number = randomValue.AsNumber();
                              if (number < 1 || number > 4 || Math.Truncate(number) != number) throw new InvalidOperationException("Native RANDARRAY bounds failure.");
                          }
                          var oversized = smokeEvaluator.Evaluate(smokeParser.Parse("SEQUENCE(1048577)", new FormulaParseOptions()), context, smokeResolver);
                          if (oversized.Kind != FormulaValueKind.Error || oversized.AsError().Type != FormulaErrorType.Num)
                              throw new InvalidOperationException("Native allocation-limit failure.");
                      }
                      workbook.Settings.EnableCompiledExpressions = true;
                      var functionNames = new List<string>();
                      foreach (var function in registry.GetAll()) functionNames.Add(function.Name);
                      functionNames.Sort(StringComparer.Ordinal);
                      File.WriteAllLines("artifacts/formula/function-catalog.txt", functionNames);
                      Console.WriteLine("Native parser/function smoke: 36 checks passed; registered names=" + functionNames.Count);
          '''
          text = text.replace(marker, smoke + '\n' + marker)
          file.write_text(text, encoding='utf-8')
          Path('artifacts/formula/native-smoke-formulas.txt').write_text('\n'.join(f'{formula} => {expected}' for formula, expected in cases) + '\nBoth compiled and interpreted paths; additionally random shape/bounds and oversized allocation checks.\n')
          PY
      - name: Publish formula benchmark and smoke executable with NativeAOT
        run: |
          set -o pipefail
          dotnet publish tools/formula-benchmarks/FormulaBenchmarks.csproj -c Release -r linux-x64 -p:PublishAot=true -o artifacts/native 2>&1 | tee artifacts/formula/native-publish.log
          if grep -E 'warning IL[0-9]+' artifacts/formula/native-publish.log; then
            echo 'Native or trimming analysis warnings require review.'
            exit 1
          fi
      - name: Execute native parser/function assertions and benchmark correctness checks
        run: |
          set -o pipefail
          ./artifacts/native/FormulaBenchmarks "$PWD/artifacts/formula/native.csv" native-aot 2>&1 | tee artifacts/formula/native-run.log
          file artifacts/native/FormulaBenchmarks > artifacts/formula/native-binary-info.txt
          sha256sum artifacts/native/FormulaBenchmarks >> artifacts/formula/native-binary-info.txt
          printf 'formula_library_source=7e46fee201940195e2b9980c1eae10d845458ea6\nplatform=linux-x64\n' > artifacts/formula/native-source.txt
      - name: Restore unmodified benchmark and remove temporary validation workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore tools/formula-benchmarks/Program.cs
          git rm .github/workflows/formula-native-validation.yml
          git commit -m 'Complete formula NativeAOT validation without retaining one-time scaffolding'
          git push origin HEAD:work/formula-final-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-native-aot-validation
          path: artifacts/formula/*
