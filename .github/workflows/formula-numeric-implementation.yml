name: Formula numeric final integration validation
on:
  push:
    branches: [work/formula-numeric-fast-path]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'wieslawsoltes/ProDataGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/formula-numeric-fast-path
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Integrate master and retain the extended benchmark scenarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          if ! git merge --no-edit origin/master; then
            python3 tools/resolve-formula-benchmark-merge.py
            git commit --no-edit
          fi
      - name: Strengthen lazy registry regression and remove scaffolding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path('src/ProDataGrid.FormulaEngine.UnitTests/FormulaConcurrentCompilationTests.cs')
          text = file.read_text(encoding='utf-8')
          old = 'second.Register(new ConstantFunction(31));'
          assert text.count(old) == 1
          text = text.replace(old, 'second.Register(new LazyConstantFunction());')
          marker = '        private sealed class ReentrantObserver'
          assert text.count(marker) == 1
          text = text.replace(marker, '''        private sealed class LazyConstantFunction : ILazyFormulaFunction
                  {
                      public string Name => "CUSTOM";
                      public FormulaFunctionInfo Info { get; } = new FormulaFunctionInfo(0, 0);
                      public FormulaValue Invoke(FormulaFunctionContext context, IReadOnlyList<FormulaValue> args)
                          => FormulaValue.FromError(new FormulaError(FormulaErrorType.Calc));
                      public FormulaValue InvokeLazy(FormulaFunctionContext context, IReadOnlyList<FormulaExpression> args,
                          FormulaEvaluator evaluator, IFormulaValueResolver resolver) => FormulaValue.FromNumber(31);
                  }

          ''' + marker)
          file.write_text(text, encoding='utf-8')
          PY
          git rm tools/apply-formula-numeric.py tools/resolve-formula-benchmark-merge.py .github/workflows/formula-numeric-implementation.yml
          git add src/ProDataGrid.FormulaEngine.UnitTests/FormulaConcurrentCompilationTests.cs
          git commit -m 'Finalize numeric and concurrent compilation regressions without implementation scaffolding'
      - name: Validate integrated production source
        run: |
          git diff HEAD^ --check
          dotnet test src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj -c Release --logger trx --results-directory artifacts/formula
      - name: Push validated clean branch
        run: git push origin HEAD:work/formula-numeric-fast-path
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-numeric-final-integration
          path: artifacts/formula/*.trx
