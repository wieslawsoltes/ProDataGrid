name: Formula net8 and default-tiering verification
on:
  push:
    branches: [work/formula-portability-validation]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'wieslawsoltes/ProDataGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/formula-portability-validation
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'
      - name: Execute the unchanged formula test sources against the net8 library targets
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj')
          s=p.read_text()
          old='<TargetFramework>net10.0</TargetFramework>'
          assert s.count(old)==1
          p.write_text(s.replace(old,'<TargetFramework>net8.0</TargetFramework>'))
          PY
          set -o pipefail
          dotnet test src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj -c Release --logger trx --results-directory artifacts/net8-tests 2>&1 | tee artifacts/net8-test.log
          git restore src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj
          dotnet --list-runtimes > artifacts/runtimes.txt
          dotnet --info > artifacts/sdk.txt
          lscpu > artifacts/cpu.txt
      - name: Prepare exact baseline and optimized core benchmark programs
        run: |
          git worktree add --detach "$RUNNER_TEMP/formula-tiered-baseline" 4cd6c6dbb002ec1fb25f0d04ed5a5e6b77374a1e
          dotnet build tools/formula-benchmarks/FormulaBenchmarks.csproj -c Release
          dotnet build "$RUNNER_TEMP/formula-tiered-baseline/tools/formula-benchmarks/FormulaBenchmarks.csproj" -c Release
      - name: Compare baseline-current-current-baseline with default runtime tiering
        run: |
          BASE="$RUNNER_TEMP/formula-tiered-baseline"
          ROOT="$PWD"
          for item in baseline-1 current-1 current-2 baseline-2; do
            SRC="$ROOT"
            case "$item" in baseline-*) SRC="$BASE" ;; esac
            dotnet run --no-build -c Release --project "$SRC/tools/formula-benchmarks/FormulaBenchmarks.csproj" -- "$ROOT/artifacts/$item.csv" "$item" > "$ROOT/artifacts/$item.log"
          done
          printf 'baseline=4cd6c6dbb002ec1fb25f0d04ed5a5e6b77374a1e\noptimized_library_source=d036d625be956942e76d05bb912221eb52fa8a24\nDOTNET_TieredCompilation=runtime-default\norder=baseline,current,current,baseline\nnet8_test_sources=unchanged;test_project_temporarily_retargeted_then_restored\n' > artifacts/measurement-context.txt
      - name: Record clean validation branch without temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/formula-portability-validation.yml
          git commit -m 'Complete net8 regression and default-tiering validation without source changes'
          git push origin HEAD:work/formula-portability-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-net8-and-default-tiering
          path: artifacts
