name: Formula compact-value final integration validation
on:
  push:
    branches: [work/formula-compact-values]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'wieslawsoltes/ProDataGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/formula-compact-values
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Integrate master and remove one-time scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-edit origin/master
          git rm tools/apply-formula-storage.py .github/workflows/formula-storage-implementation.yml
          git commit -m 'Remove compact storage implementation scaffolding after measured validation'
      - name: Validate integrated production source
        run: |
          git diff HEAD^ --check
          dotnet test src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj -c Release --logger trx --results-directory artifacts/formula
      - name: Push validated clean branch
        run: git push origin HEAD:work/formula-compact-values
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-storage-final-integration
          path: artifacts/formula/*.trx
