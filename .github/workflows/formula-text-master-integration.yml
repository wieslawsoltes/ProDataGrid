name: Formula text master integration
on:
  push:
    branches: [work/formula-text-unicode]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'wieslawsoltes/ProDataGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/formula-text-unicode
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Integrate merged helper PR and preserve concurrent master work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-edit origin/master
          git rm .github/workflows/formula-text-master-integration.yml
          git commit -m 'Finalize text formulas against merged helper source without temporary workflow'
      - name: Validate exact integrated source
        run: |
          git diff HEAD^ --check
          dotnet test src/ProDataGrid.FormulaEngine.UnitTests/ProDataGrid.FormulaEngine.UnitTests.csproj -c Release --logger trx --results-directory artifacts/tests
          dotnet build src/ProDataGrid.FormulaEngine.Excel/ProDataGrid.FormulaEngine.Excel.csproj -c Release
          dotnet run -c Release --project tools/formula-function-benchmarks/FormulaFunctionBenchmarks.csproj -- artifacts/smoke smoke
      - name: Push clean tested branch
        run: git push origin HEAD:work/formula-text-unicode
      - name: Export exact source evidence
        if: always()
        run: |
          mkdir -p artifacts
          git archive HEAD > artifacts/source.tar
          git rev-parse HEAD > artifacts/revision.txt
          git ls-tree -r HEAD src/ProDataGrid.FormulaEngine src/ProDataGrid.FormulaEngine.Excel src/ProDataGrid.FormulaEngine.UnitTests tools/formula-function-benchmarks > artifacts/validated-source-blobs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-text-master-integration
          path: artifacts
